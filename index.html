<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavola: Breakfast &amp; dinner for two</title>
<meta name="description" content="Healthy breakfasts and Mediterranean dinners for two, with fresh daily ideas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tavola">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B27" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4EF; --surface:#FBFCF9; --surface-2:#E7EBE3; --ink:#15273A; --ink-soft:#4D5E6D; --line:#D3DAD0;
  --sea:#1F5C8C; --sea-ink:#FFFFFF; --olive:#56682A; --lemon:#EDC94F; --lemon-ink:#2A2306; --tile:#2A6596;
  --tomato:#B8432F; --saffron:#D39A12; --focus:#1F5C8C; --scrim:rgba(14,27,39,.42);
  --c-fish:#2A6596; --c-poultry:#B97E12; --c-legumes:#A0452F; --c-vegetarian:#56682A; --c-eggs:#9C7F0E;
  --font-display:"Marcellus","Songti SC","Noto Serif SC","STSong",Georgia,serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B27; --surface:#162536; --surface-2:#1F3146; --ink:#E5EBEF; --ink-soft:#A2B1BE; --line:#2B3F55;
    --sea:#7DB3DE; --sea-ink:#0F1B27; --olive:#AEC16E; --lemon:#F0D06A; --lemon-ink:#231C02; --tile:#3F7BAB;
    --tomato:#EE8B76; --saffron:#F0C04A; --focus:#F0D06A; --scrim:rgba(0,0,0,.6);
    --c-fish:#6FA6D6; --c-poultry:#E2B04A; --c-legumes:#E08A70; --c-vegetarian:#A9BE6B; --c-eggs:#E5C95A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B27; --surface:#162536; --surface-2:#1F3146; --ink:#E5EBEF; --ink-soft:#A2B1BE; --line:#2B3F55;
  --sea:#7DB3DE; --sea-ink:#0F1B27; --olive:#AEC16E; --lemon:#F0D06A; --lemon-ink:#231C02; --tile:#3F7BAB;
  --tomato:#EE8B76; --saffron:#F0C04A; --focus:#F0D06A; --scrim:rgba(0,0,0,.6);
  --c-fish:#6FA6D6; --c-poultry:#E2B04A; --c-legumes:#E08A70; --c-vegetarian:#A9BE6B; --c-eggs:#E5C95A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 48px}

/* header */
.top{position:relative;display:flex;align-items:center;gap:14px;padding:18px 0 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;color:inherit;text-decoration:none;border-radius:8px}
.brand .tile{width:32px;height:32px}
.wordmark{font-family:var(--font-display);font-size:1.7rem;line-height:1;letter-spacing:.01em}
.nav{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:12px}
.nav button{border:0;background:transparent;color:var(--ink-soft);font-weight:600;font-size:.95rem;padding:8px 18px;border-radius:9px;cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (max-width:640px){
  .nav{order:3;width:100%}
  .nav button{flex:1;padding:9px 6px}
}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:34px;height:34px;border-color:transparent;background:transparent;color:inherit}
.icon-btn.sm:hover{background:rgba(127,127,127,.18)}
.icon-btn.fav.on{color:var(--tomato)}

/* settings popover */
.pop{position:absolute;top:68px;right:0;z-index:40;width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px -24px rgba(0,0,0,.4);padding:18px;display:grid;gap:16px}
@media (max-width:640px){.pop{top:62px}}
.pop-row{display:grid;gap:8px}
.pop-lbl{font-weight:600;font-size:.92rem}
.pop-desc{margin:2px 0 0;color:var(--ink-soft);font-size:.86rem;line-height:1.45}
.pop-switch{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line)}
.pop-note{margin:0;color:var(--ink-soft);font-size:.82rem}
.pop-field{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.pop-field .pop-desc{margin:0}
.pop-field .input{font-size:.9rem;padding:9px 12px}
.pop-actions{display:flex;gap:8px;flex-wrap:wrap}
.switch{flex:none;width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;margin-top:2px}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--sea)}
.switch[aria-checked="true"] span{transform:translateX(18px)}

/* segmented + chips */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-soft);font-size:.88rem;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.9rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.98rem;padding:11px 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--sea);color:var(--sea-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-done{background:var(--olive);color:var(--surface)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn.danger{color:var(--tomato)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.input{font:inherit;font-size:1rem;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.input::placeholder{color:var(--ink-soft);opacity:.8}
textarea.input{min-height:104px;resize:vertical;line-height:1.5}

/* tiles */
.tile{display:block;color:var(--c,var(--tile));border-radius:5px;overflow:hidden;flex:none}
.tile svg{display:block;width:100%;height:100%}
.cat-fish{--c:var(--c-fish)} .cat-poultry{--c:var(--c-poultry)} .cat-legumes{--c:var(--c-legumes)}
.cat-vegetarian{--c:var(--c-vegetarian)} .cat-eggs{--c:var(--c-eggs)}

/* hero: the tiled frame */
.hero{--fr:24px;position:relative;padding:var(--fr);border-radius:6px}
@media (max-width:640px){.hero{--fr:16px}}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--tile);
  -webkit-mask:var(--tile-mask) 0 0/var(--fr) var(--fr) repeat;mask:var(--tile-mask) 0 0/var(--fr) var(--fr) repeat}
.hero-in{position:relative;background:var(--surface);border-radius:3px;padding:clamp(24px,5vw,60px);display:grid;gap:16px;justify-items:start}
.date{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:0;font-family:var(--font-display);font-size:1.2rem;color:var(--ink-soft)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-body);background:var(--lemon);color:var(--lemon-ink);font-weight:600;font-size:.8rem;padding:3px 10px 3px 8px;border-radius:999px}
.badge svg{width:14px;height:14px}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,5.6vw,4.1rem);line-height:1.04;margin:0;max-width:17ch;text-wrap:balance;letter-spacing:-.005em}
.desc{font-size:1.1rem;color:var(--ink-soft);max-width:56ch;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;padding:0;margin:0;color:var(--ink-soft);font-size:.92rem}
.meta li{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:17px;height:17px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.status{display:flex;align-items:center;gap:10px;margin:4px 0 0;color:var(--ink-soft);font-size:.92rem}
.spin{width:20px;height:20px;display:inline-block}
.spin .tile{width:20px;height:20px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* sections */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,5vw,56px);margin-top:clamp(32px,5vw,52px)}
.sec h2{font-family:var(--font-display);font-weight:400;font-size:1.6rem;margin:0 0 10px;line-height:1.2}
.empty{color:var(--ink-soft);margin:6px 0 0;max-width:46ch}
.page-head{margin:6px 0 22px}
.page-head h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,4.6vw,3rem);line-height:1.08;margin:0}
.page-head p{margin:8px 0 0;color:var(--ink-soft);max-width:60ch}

/* recipe rows */
.rlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rlist > li{border-bottom:1px solid var(--line)}
.rlist.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));column-gap:36px;border-top:0}
.rlist.grid2 > li{border-top:1px solid var(--line);border-bottom:0}
.row{display:grid;grid-template-columns:50px 1fr auto;gap:14px;align-items:center;width:100%;padding:12px 6px;background:none;border:0;text-align:left;cursor:pointer;border-radius:6px}
.row:hover{background:var(--surface-2)}
.row .tile{width:50px;height:50px}
.rbody{display:grid;gap:3px;min-width:0}
.rt{font-weight:600;line-height:1.3}
.rm{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--ink-soft)}
.rm span{display:inline-flex;align-items:center;gap:5px}
.rm svg{width:14px;height:14px}
.rm .new{color:var(--lemon-ink);background:var(--lemon);border-radius:999px;padding:0 8px;font-weight:600}
.side{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:.85rem;font-weight:600}
.side svg{width:16px;height:16px}
.side .hfav{color:var(--tomato);display:inline-flex}
.side .rstar{display:inline-flex;align-items:center;gap:3px;color:var(--ink)}
.side .rstar svg{color:var(--saffron)}

.recipe-edit { margin: 1.5rem 0; }
.recipe-edit textarea { min-height: 6rem; resize: vertical; }
.recipe-edit .result li { margin-bottom: .6rem; }
.recipe-edit .result { overflow-wrap: anywhere; }

.meal-tabs { margin: 0 0 1.5rem; }
/* discover */
.disc{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:clamp(28px,5vw,64px);align-items:start}
@media (max-width:860px){.disc{grid-template-columns:1fr}}
.fgroup{border:0;padding:0;margin:0 0 22px;min-width:0}
.fgroup legend,.flabel{display:block;font-weight:600;font-size:.95rem;margin-bottom:9px;padding:0}
.disc-actions{display:flex;flex-wrap:wrap;gap:10px}
.disc-out{min-height:200px}
.placeholder{display:grid;justify-items:start;gap:14px;padding:28px 0;color:var(--ink-soft)}
.placeholder .row3{display:flex;gap:8px}
.placeholder .tile{width:44px;height:44px;opacity:.55}
.working{display:grid;gap:14px;justify-items:start;padding:24px 0}
.working .w-title{font-family:var(--font-display);font-size:1.5rem;margin:0;line-height:1.2}
.working .w-hint{margin:0;color:var(--ink-soft);font-size:.92rem}
.progress{width:min(100%,420px);height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;width:var(--p,10%);background:var(--sea);border-radius:3px;transition:width .5s ease}
.progress.indet span{width:28%;animation:slide 1.5s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
.result{display:grid;gap:14px;justify-items:start;padding:clamp(20px,3vw,32px);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.result .tile{width:60px;height:60px}
.result h2{font-family:var(--font-display);font-weight:400;font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.1;margin:0;text-wrap:balance}
.health{display:flex;gap:10px;align-items:flex-start;color:var(--olive);font-size:.95rem;margin:0;max-width:62ch}
.health svg{width:18px;height:18px;margin-top:3px}
.err{margin:0 0 16px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--tomato) 14%,transparent);color:var(--ink);border-left:3px solid var(--tomato)}
.note{margin:0 0 16px;color:var(--ink-soft)}

/* library */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.search{flex:1 1 260px;position:relative;display:block}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-soft);pointer-events:none}
.search .input{padding-left:40px}
.sortl select{width:auto;padding-right:34px}
.lib-chips{margin-bottom:22px}

/* detail overlay */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:900px;margin:0 auto;border-radius:16px;box-shadow:0 30px 90px -20px rgba(0,0,0,.5)}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
@media (min-width:641px){.sheet-bar{top:calc(-28px - env(safe-area-inset-top,0px))}}
.bar-title{flex:1;min-width:0;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft)}
.sheet-body{padding:clamp(22px,4.5vw,44px)}
@media (max-width:640px){
  .overlay{padding:0}
  .sheet{border-radius:0;min-height:100%;box-shadow:none}
  .sheet-bar{border-radius:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .sheet-body{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
}
.d-head{display:grid;gap:12px;justify-items:start;margin-bottom:26px}
.d-head .tile{width:62px;height:62px}
.d-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,4.6vw,3rem);line-height:1.06;margin:0;text-wrap:balance}
.d-controls{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:30px}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper .lbl{font-weight:600;font-size:.95rem;margin-right:2px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.stepper button svg{width:16px;height:16px}
.stepper button[disabled]{opacity:.4;cursor:not-allowed}
.stepper output{min-width:2ch;text-align:center;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.d-cols{display:grid;grid-template-columns:minmax(240px,330px) 1fr;gap:clamp(28px,4.5vw,56px)}
@media (max-width:740px){.d-cols{grid-template-columns:1fr}}
.d-cols h3,.mine h3,.h3like{display:block;font-family:var(--font-display);font-weight:400;font-size:1.45rem;margin:0 0 12px;line-height:1.2}
.ings{list-style:none;margin:0;padding:0}
.ing{display:grid;grid-template-columns:20px minmax(70px,max-content) 1fr;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:10px 2px;cursor:pointer;line-height:1.4}
.ing .box{width:19px;height:19px;border:1.5px solid var(--ink-soft);border-radius:5px;align-self:center;display:grid;place-items:center}
.ing .box svg{width:13px;height:13px;opacity:0}
.ing[aria-pressed="true"] .box{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.ing[aria-pressed="true"] .box svg{opacity:1}
.ing[aria-pressed="true"] .amt,.ing[aria-pressed="true"] .nm{text-decoration:line-through;color:var(--ink-soft)}
.ing .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:2px 0 22px}
.step .num{font-family:var(--font-display);font-size:1.6rem;line-height:1.05;color:var(--sea)}
.step p{margin:0 0 10px;max-width:62ch}
.step p strong{font-weight:700;white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:7px 14px 7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.tbtn svg{width:17px;height:17px}
.tbtn.run{background:var(--lemon);color:var(--lemon-ink);border-color:transparent;font-variant-numeric:tabular-nums}
.tbtn.paused{background:transparent;border-color:var(--lemon)}
.tbtn.done{background:var(--tomato);color:#fff;border-color:transparent}
.tips{margin-top:6px;padding:20px 22px 14px;border-radius:12px;background:var(--surface-2)}
.tips h3{margin-bottom:8px}
.tips ul{margin:0;padding-left:20px}
.tips li{margin:0 0 8px;max-width:66ch;line-height:1.5}
.tips li::marker{color:var(--olive)}
.mine{margin-top:16px;padding-top:28px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:740px){.mine{grid-template-columns:1fr}}
.stars{display:flex;gap:2px;margin:-4px 0 18px -4px}
.star{background:none;border:0;padding:4px;cursor:pointer;color:var(--line);border-radius:6px}
.star svg{width:30px;height:30px;display:block}
.star.on{color:var(--saffron)}
.cooked{display:grid;gap:8px;justify-items:start}
.cooked-info{margin:0;color:var(--ink-soft);font-size:.9rem}

/* timers */
.timers{position:fixed;z-index:60;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100% - 32px))}
@media (max-width:640px){.timers{left:12px;right:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
.timer{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:14px;box-shadow:0 14px 34px -12px rgba(0,0,0,.55)}
.timer .t-ic svg{width:20px;height:20px;display:block;opacity:.8}
.t-main{flex:1;min-width:0;display:grid;background:none;border:0;padding:2px 4px;text-align:left;cursor:pointer;border-radius:8px}
.t-time{font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.15}
.t-label{font-size:.82rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer.paused .t-time{opacity:.6}
.timer.done{background:var(--lemon);color:var(--lemon-ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
body.has-timers .wrap{padding-bottom:140px}

/* toast + footer */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:.92rem;z-index:80;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:.85rem}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

  steps:[ P(600,'In a small bowl, mix most of the olive oil with half the garlic, the lemon zest and most of the juice, the oregano and thyme. Pat the salmon dry, season with salt and pepper and spread the marinade over it. Leave for 10 minutes.','In einer kleinen Schüssel den Großteil des Olivenöls mit der Hälfte des Knoblauchs, der Zitronenschale und dem Großteil des Safts, Oregano und Thymian verrühren. Den Lachs trocken tupfen, mit Salz und Pfeffer würzen und die Marinade gleichmäßig auftragen. 10 Minuten einwirken lassen.','小碗中将大部分橄榄油、一半蒜末、柠檬皮屑和大部分柠檬汁、牛至和百里香拌匀。三文鱼擦干，用盐和黑胡椒调味，均匀抹上腌料，腌 10 分钟。'),
    P(660,'Heat the air fryer to {T190}. Lay the salmon in the basket (baking paper underneath is recommended) and cook for 10–12 minutes. Check at 10 minutes: the centre may still be slightly translucent.','Den Air Fryer auf {T190} vorheizen. Den Lachs in den Korb legen (Backpapier darunter empfohlen) und 10–12 Minuten garen. Bei 10 Minuten prüfen: Die Mitte darf noch leicht glasig sein!','空气炸锅预热至{T190}。把三文鱼放入炸篮（建议垫烘焙纸），烤 10–12 分钟。10 分钟时检查：中心略带半透明正好。'),
    P(240,'Meanwhile, heat the remaining oil in a pan over medium heat. Add the tomatoes and the rest of the garlic and fry for 3–4 minutes until the tomatoes start to burst.','Inzwischen das restliche Öl in einer Pfanne bei mittlerer Hitze erhitzen. Kirschtomaten und den restlichen Knoblauch zugeben und 3–4 Minuten anbraten, bis die Tomaten leicht aufplatzen.','同时，平底锅中火加热剩余的油，放入圣女果和剩余蒜末炒 3–4 分钟，至番茄微微爆开。'),
    P(180,'Stir in the white beans and capers and warm for 3 minutes. Fold in the spinach until just wilted and season with salt and pepper.','Weiße Bohnen und Kapern unterrühren und 3 Minuten erwärmen. Den Babyspinat unterheben, kurz zusammenfallen lassen und mit Salz und Pfeffer abschmecken.','拌入白芸豆和刺山柑加热 3 分钟，再拌入菠菜至刚变软，用盐和黑胡椒调味。'),
    P(0,'Spoon the beans and tomatoes onto plates and top with the salmon. Scatter over the torn basil and finish with a squeeze of lemon. Buon appetito!','Die Bohnen-Tomaten-Mischung auf Tellern anrichten und den Lachs darauflegen. Das zerzupfte Basilikum darüberstreuen und mit einem Spritzer Zitrone abrunden. Buon appetito!','把豆子番茄盛入盘中，放上三文鱼，撒上撕碎的罗勒叶，再挤一点柠檬汁。Buon appetito！') ],
  tips:[ T('Don’t overdo the salmon: it’s ready when the centre is still slightly translucent. That’s perfect, not raw.','Lachs nicht zu lange garen! Er ist fertig, wenn die Mitte noch leicht glasig ist – das ist perfekt, nicht roh.','三文鱼别烤过头：中心略带半透明就熟了，这是最佳状态，并不是生的。'),
    T('Bought it with skin? No problem: cook it skin-side down. The skin protects the flesh and turns crisp.','Mit Haut gekauft? Kein Problem: einfach mit der Haut nach unten in den Air Fryer legen – die Haut schützt das Fleisch und wird schön knusprig.','买的是带皮的？没关系，皮朝下放入空气炸锅，鱼皮能保护鱼肉，还会变得酥脆。'),
    T('Omega-3 from the salmon and potassium from the beans and spinach make this kind to blood pressure.','Omega-3 aus dem Lachs und Kalium aus Bohnen und Spinat – blutdruckfreundlich.','三文鱼的 Omega-3 加上豆子和菠菜的钾，对血压很友好。'),
    T('Baking paper in the air fryer stops the fish from sticking.','Backpapier im Air Fryer verhindert, dass der Fisch klebt.','空气炸锅里垫烘焙纸，鱼不会粘篮。') ] },
{ id:'f5', fav:true, region:'northafrican', protein:'eggs', time:30, kcal:720,
  title:T('Classic shakshuka with feta','Klassische Shakshuka mit Feta','经典菲达奶酪北非蛋'),
  desc:T('Eggs poached in a spiced tomato and pepper sauce, topped with feta, with crisp bread for dipping.','Würzige Tomaten-Paprika-Soße, pochierte Eier und Feta obendrauf – herzhaft, mediterran und mit knusprigem Brot zum Dippen.','鸡蛋在香料番茄甜椒酱中焖熟，撒上菲达奶酪，配香脆面包蘸着吃。'),
  health:T('Eggs bring quality protein, and wholegrain bread adds fibre for steady energy.','Eier liefern hochwertiges Eiweiß, Vollkornbrot Ballaststoffe für lang anhaltende Energie.','鸡蛋提供优质蛋白，全麦面包补充纤维，能量更持久。'),
  ing:[ I(4,'pc','eggs','Eier','鸡蛋'), I(400,'g','canned chopped tomatoes','gehackte Tomaten aus der Dose','罐装番茄碎'),
    I(1,'pc','red bell pepper, in strips','rote Paprika, in Streifen','红甜椒（切条）'), I(1,'pc','onion, finely chopped','Zwiebel, fein gehackt','洋葱（切碎）'),
    I(4,'pc',...GARLIC_CH), I(3,'tbsp',...OIL), I(100,'g',...FETA_C), I(1,'tsp',...SMOKED),
    I(0.5,'tsp','ground cumin','gemahlener Kreuzkümmel','孜然粉'), I(0.25,'tsp','ground cinnamon','gemahlener Zimt','肉桂粉'),
    I(0.5,'tsp',...CHILI), I(1,'tsp',...OREG), I(1,'tsp',...SALT), I(0.5,'tsp',...PEP), I(5,'pc',...BASIL), I(0.5,'pc',...LEMON_J),
    I(4,'pc','slices of wholegrain bread','Scheiben Vollkornbrot','全麦面包片') ],
  steps:[ P(420,'Heat the olive oil in a large pan over medium heat. Soften the onion for 3–4 minutes, then add the pepper and cook for another 3 minutes until soft.','Das Olivenöl in einer großen Pfanne bei mittlerer Hitze erhitzen. Die Zwiebel 3–4 Minuten glasig anschwitzen, dann die Paprika zugeben und weitere 3 Minuten mitbraten, bis sie weich wird.','大平底锅中火加热橄榄油，洋葱炒 3–4 分钟至透明，再加入甜椒炒 3 分钟至变软。'),
    P(60,'Add the garlic, paprika, cumin, cinnamon, chili and oregano and fry for 1 minute until fragrant.','Knoblauch, Paprikapulver, Kreuzkümmel, Zimt, Chiliflocken und Oregano zugeben und 1 Minute mitbraten, bis die Gewürze duften.','加入蒜末、红椒粉、孜然粉、肉桂粉、辣椒碎和牛至炒 1 分钟，至香料出香味。'),
    P(600,'Add the tomatoes, stir well and simmer over medium heat for 8–10 minutes until the sauce thickens. Season with salt and pepper.','Die Dosentomaten zugeben, gut umrühren und bei mittlerer Hitze 8–10 Minuten köcheln lassen, bis die Soße eindickt. Mit Salz und Pfeffer abschmecken.','倒入番茄碎拌匀，中火炖 8–10 分钟至酱汁变稠，用盐和黑胡椒调味。'),
    P(360,'Press four wells into the sauce. Crack each egg into a cup and slide it gently into a well. Cover and poach over medium heat for 4–6 minutes until the whites are set but the yolks are still runny.','Vier Mulden in die Soße drücken. Die Eier einzeln in eine Tasse aufschlagen und vorsichtig in die Mulden gleiten lassen. Deckel drauf und 4–6 Minuten bei mittlerer Hitze pochieren, bis das Eiweiß gestockt ist, das Eigelb aber noch flüssig bleibt.','在酱中压出四个小坑。鸡蛋逐个打入杯中，再轻轻滑入坑里。盖上锅盖中火焖 4–6 分钟，至蛋白凝固、蛋黄仍是流心。'),
    P(240,'Crumble the feta over, drizzle with the lemon juice and scatter with torn basil. Toast the bread in the air fryer at {T180} and serve straight from the pan.','Den Feta darüberbröseln, mit dem Zitronensaft beträufeln und das zerzupfte Basilikum darüberstreuen. Das Vollkornbrot im Air Fryer bei {T180} toasten und direkt aus der Pfanne servieren!','撒上捏碎的菲达奶酪，淋上柠檬汁，撒上撕碎的罗勒叶。全麦面包放入空气炸锅以{T180}烤脆，直接连锅上桌。') ],
  tips:[ T('Don’t overcook the eggs: keep the lid on and watch closely. The yolks should stay runny.','Eier nicht übergaren! Deckel drauf und genau im Auge behalten – das Eigelb muss noch flüssig sein.','鸡蛋别煮过头：盖上锅盖并留意观察，蛋黄要保持流心。'),
    T('Crack each egg into a cup first, then slide it into its well, so the yolk stays whole.','Eier einzeln in eine Tasse aufschlagen und dann vorsichtig in die Mulde gleiten lassen – so bleibt das Eigelb ganz.','鸡蛋先逐个打入杯中，再滑进小坑，蛋黄就不会破。'),
    T('Toast the bread in the air fryer at {T180} for 3–4 minutes for a lovely crunch.','Brot im Air Fryer bei {T180} 3–4 Minuten toasten – wird herrlich knusprig.','面包用空气炸锅以{T180}烤 3–4 分钟，香脆可口。'),
    T('Oxalate-friendly: no high-oxalate ingredients, and tomatoes are only moderate.','Oxalat-freundlich: keine oxalatreichen Zutaten – Tomaten haben nur moderate Werte.','低草酸友好：没有高草酸食材，番茄的草酸含量也只是中等。') ] },

{ id:'s1', region:'greek', protein:'poultry', time:40, kcal:540,

    P(1080,'Heat the air fryer to {T200}. Cook the chicken in a single layer, turning it halfway, until cooked through and golden.','Den Air Fryer auf {T200} vorheizen. Das Hähnchen nebeneinander hineinlegen und garen, bis es durch und goldbraun ist; nach der Hälfte einmal wenden.','空气炸锅预热至{T200}。把鸡肉平铺放入，烤至熟透金黄，中途翻面一次。'),

    P(120,'Slice the chicken over the vegetables, squeeze over the remaining lemon juice and crumble the feta on top. Let it rest briefly before serving.','Das Hähnchen in Scheiben auf dem Gemüse anrichten, mit dem restlichen Zitronensaft beträufeln und den Feta darüberbröseln. Kurz ruhen lassen.','鸡肉切片铺在蔬菜上，淋上剩余柠檬汁，撒上碾碎的菲达奶酪，稍微静置后上桌。') ] },

/* ---------- storage: account (db) with browser fallback ---------- */
const Store = {
  mode: 'local', db: null, uid: null, chain: Promise.resolve(),
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({settings:S.settings, prefs:S.prefs, ai:S.ai})); } catch {} },
  prefsRef() { return this.db.doc(`data/users/${this.uid}/prefs`); },
  recCol() { return this.prefsRef().collection('recipes'); },
  async connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch { return; }
    if (!db || !user) return;
    let uid = null;
    try { uid = await user.id(); } catch {}
    if (!uid) return;
    this.db = db; this.uid = uid;
    try {
      const [ps, rs] = await Promise.all([this.prefsRef().get(), this.recCol().limit(500).get()]);
      this.mode = 'db';
      if (ps.exists) S.prefs = normPrefs((ps.data() || {}).prefs);
      else this.pushPrefs();
      const gone = new Set(S.prefs.deleted);
      const remote = rs.docs.map(d => d.data()).filter(validRecipe);
      const ids = new Set(remote.map(r => r.id));
      const localOnly = S.ai.filter(r => !ids.has(r.id) && !gone.has(r.id));
      S.ai = remote.concat(localOnly).sort((a, b) => (a.created || 0) - (b.created || 0));
      localOnly.forEach(r => this.saveRecipe(r));
      this.saveLocal();
    } catch (e) { console.warn('Tavola: account storage unavailable', e); this.mode = 'local'; }
  },
  write(fn) { this.chain = this.chain.then(fn).catch(e => this.fail(e)); },

    let s = Math.random() * 1.5;

/* ---------- timers ---------- */
let AC = null, tickH = null;
function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch {} }
function chime() {
  if (!AC) return;
  try {
    const now = AC.currentTime;
    [659.25, 783.99, 1046.5].forEach((fq, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t0 = now + i * .22;
      o.type = 'sine'; o.frequency.value = fq;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.32, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .9);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + 1);
    });
  } catch {}
}
const remaining = tm => tm.done ? 0 : tm.paused ? tm.left / 1000 : (tm.endAt - Date.now()) / 1000;
function startTimer(rid, step) {
  const r = byId(rid); if (!r || !r.steps[step]) return;
  unlockAudio();
  const secs = r.steps[step].t;
  S.timers.push({tid: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), rid, step, endAt: Date.now() + secs * 1000, left: secs * 1000, paused: false, done: false, rings: 0, nextRing: 0});
  ensureTick(); renderTimers();
  if (S.openId) renderDetailKeep();
}
function toggleTimer(tid) {
  const tm = S.timers.find(x => x.tid === tid); if (!tm || tm.done) return;
  unlockAudio();
  if (tm.paused) { tm.endAt = Date.now() + tm.left; tm.paused = false; ensureTick(); }
  else { tm.left = Math.max(0, tm.endAt - Date.now()); tm.paused = true; }
  renderTimers(); if (S.openId) renderDetailKeep();
}
function dismissTimer(tid) {
  S.timers = S.timers.filter(x => x.tid !== tid);
  renderTimers(); if (S.openId) renderDetailKeep();
}
function ensureTick() { if (!tickH) tickH = setInterval(tick, 500); }
function tick() {
  const now = Date.now(); let changed = false;
  for (const tm of S.timers) {
    if (!tm.done && !tm.paused && tm.endAt <= now) {
      tm.done = true; changed = true;
      const r = byId(tm.rid);
      toast(`${t('timer_done')}: ${t('step', {n: tm.step + 1})}, ${r ? tx(r.title) : ''}`);
      try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch {}
    }
    if (tm.done && tm.rings < 6 && now >= tm.nextRing) { chime(); tm.rings++; tm.nextRing = now + 4000; }
  }
  if (changed) { renderTimers(); if (S.openId) renderDetailKeep(); }
  else for (const tm of S.timers) {
    if (tm.done) continue;
    const v = fmtClock(remaining(tm));
    $$(`[data-ttime="${tm.tid}"]`).forEach(e => { if (e.textContent !== v) e.textContent = v; });
  }
  updateTitle();
  if (!S.timers.some(tm => (!tm.done && !tm.paused) || (tm.done && tm.rings < 6))) { clearInterval(tickH); tickH = null; }
}
function renderTimers() {
  document.body.classList.toggle('has-timers', S.timers.length > 0);
  $('#timers').innerHTML = S.timers.map(tm => {
    const r = byId(tm.rid);
    return `<div class="timer ${tm.done ? 'done' : ''} ${tm.paused ? 'paused' : ''}">
      <span class="t-ic">${tm.done ? ICON.bell : ICON.timer}</span>
      <button class="t-main" data-action="open" data-id="${tm.rid}">
        <span class="t-time" ${tm.done ? '' : `data-ttime="${tm.tid}"`}>${tm.done ? esc(t('timer_done')) : fmtClock(remaining(tm))}</span>
        <span class="t-label">${esc(t('step', {n: tm.step + 1}))}: ${esc(r ? tx(r.title) : '')}</span>
      </button>
      ${tm.done ? `<button class="icon-btn sm" data-action="tdismiss" data-tid="${tm.tid}" aria-label="${esc(t('dismiss'))}">${ICON.check}</button>`
        : `<button class="icon-btn sm" data-action="ttoggle" data-tid="${tm.tid}" aria-label="${esc(t(tm.paused ? 'resume' : 'pause'))}">${tm.paused ? ICON.play : ICON.pause}</button>
           <button class="icon-btn sm" data-action="tdismiss" data-tid="${tm.tid}" aria-label="${esc(t('cancel_timer'))}">${ICON.x}</button>`}
    </div>`;
  }).join('');
  updateTitle();
}
function updateTitle() {
  const running = S.timers.filter(x => !x.done && !x.paused).map(remaining);
  document.title = S.timers.some(x => x.done) ? `⏰ ${t('timer_done')}` : running.length ? `${fmtClock(Math.min(...running))} – Tavola` : 'Tavola';
}

/* ---------- actions ---------- */
let toastT = null;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3400); }
const hostTheme = document.documentElement.getAttribute('data-theme');
function applyTheme() {
  const th = S.settings.theme, root = document.documentElement;
  if (th === 'auto') { if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', th);
}
function applyLang() { document.documentElement.lang = {en:'en', de:'de', zh:'zh-CN'}[S.settings.lang] || 'en'; }
function renderAll() { renderTop(); renderMain(); renderFoot(); if (S.openId) renderDetailKeep(); renderTimers(); }
function setSetting(k, v) {
  S.settings[k] = v; Store.saveLocal();
  if (k === 'theme') applyTheme();
  if (k === 'lang') applyLang();
  if (k === 'provider') { S.aiAvailable = !!activeKey(); S.gen.error = null; if (S.aiAvailable) maybeAutoDaily(); }
  renderAll();
  const n = $(`#settingsPop [data-k="${k}"][data-v="${v}"]`); if (n) n.focus();
}
function toggleFav(id) { if (S.prefs.favs[id]) delete S.prefs.favs[id]; else S.prefs.favs[id] = true; savePrefs(); renderDetailKeep(); }
function setRating(id, n) { if (rating(id) === n) delete S.prefs.ratings[id]; else S.prefs.ratings[id] = n; savePrefs(); renderDetailKeep(); }
function logCooked(id) {
  const c = cookedList(id).slice(), td = todayKey();
  if (c[c.length - 1] === td) c.pop(); else c.push(td);
  if (c.length) S.prefs.cooked[id] = c.slice(-60); else delete S.prefs.cooked[id];
  savePrefs(); renderDetailKeep();
}
let delT = null;
function deleteRecipe(id) {
  if (S.confirmDel !== id) {
    S.confirmDel = id; renderDetailKeep();
    clearTimeout(delT); delT = setTimeout(() => { if (S.confirmDel === id) { S.confirmDel = null; if (S.openId === id) renderDetailKeep(); } }, 4000);
    return;
  }
  S.ai = S.ai.filter(r => r.id !== id);
  for (const k of ['favs','ratings','notes','cooked']) delete S.prefs[k][id];
  S.prefs.deleted = S.prefs.deleted.concat(id).slice(-200);
  S.timers = S.timers.filter(x => x.rid !== id);
  if (S.discResult === id) S.discResult = null;
  ensureDaily();
  Store.deleteRecipe(id); savePrefs();
  lastOpener = null; closeDetail(); renderTimers(); toast(t('deleted'));
}
function surprise() {
  const d = S.disc, words = d.useup.toLowerCase().split(/[,;]+/).map(s => s.trim()).filter(Boolean);
  let list = mealRecipes().filter(r =>
    (d.protein === 'any' || r.protein === d.protein) && (d.region === 'any' || r.region === d.region) && (d.time === 'any' || r.time <= +d.time));
  if (words.length) { const hit = list.filter(r => r.ing.some(i => words.some(w => (i.n.en + ' ' + tx(i.n)).toLowerCase().includes(w)))); if (hit.length) list = hit; }
  const r = pickFrom(list, S.discResult);
  S.gen.error = null;
  if (r) { S.discResult = r.id; S.discMsg = null; } else { S.discResult = null; S.discMsg = 'no_match'; }
  $('#discOut').innerHTML = renderDiscOut();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (S.settingsOpen && !e.target.closest('#settingsPop') && !e.target.closest('#setBtn')) { S.settingsOpen = false; renderTop(); if (!a) return; }
  if (!a) { if (e.target.id === 'overlay') closeDetail(); return; }
  const act = a.dataset.action, id = a.dataset.id;
  switch (act) {
    case 'tab':
      e.preventDefault();
      if (S.openId) { lastOpener = null; closeDetail(); }
      S.view = a.dataset.v; S.settingsOpen = false; renderTop(); renderMain(); window.scrollTo(0, 0);
      break;
    case 'settings': S.settingsOpen = !S.settingsOpen; renderTop(); if (S.settingsOpen) { const b = $('#settingsPop button'); if (b) b.focus(); } else $('#setBtn').focus(); break;
    case 'set': setSetting(a.dataset.k, a.dataset.v); break;
    case 'toggle-daily': S.settings.autoDaily = !S.settings.autoDaily; Store.saveLocal(); renderTop(); { const b = $('#settingsPop .switch'); if (b) b.focus(); } if (S.settings.autoDaily) maybeAutoDaily(); break;
    case 'toggle-oven': S.settings.oven = !S.settings.oven; Store.saveLocal(); renderTop(); { const b = $('#settingsPop [data-action="toggle-oven"]'); if (b) b.focus(); } break;
    case 'api-save': {
      const v = ($('#apiKey') || {}).value || '';
      if (!v.trim()) { const i = $('#apiKey'); if (i) i.focus(); break; }
      try { localStorage.setItem(KEYS_LS[provider()], v.trim()); } catch {}
      S.aiAvailable = true; S.gen.error = null; renderTop(); renderMain(); toast(t('api_saved')); maybeAutoDaily(); break;
    }
    case 'api-remove': try { localStorage.removeItem(KEYS_LS[provider()]); } catch {} S.aiAvailable = false; renderTop(); renderMain(); toast(t('api_removed')); break;
    case 'export': exportBackup(); break;
    case 'open': openDetail(id, a); break;
    case 'close': closeDetail(); break;
    case 'fav': toggleFav(id); break;
    case 'rate': setRating(id, +a.dataset.n); break;
    case 'cooked': logCooked(id); break;
    case 'delete': deleteRecipe(id); break;
    case 'serv': S.servings = Math.min(8, Math.max(1, S.servings + +a.dataset.d)); renderDetailKeep(); break;
    case 'ing': { const i = +a.dataset.i; if (S.checked.has(i)) S.checked.delete(i); else S.checked.add(i); a.setAttribute('aria-pressed', S.checked.has(i)); break; }
    case 'tstart': startTimer(id, +a.dataset.step); break;
    case 'ttoggle': toggleTimer(a.dataset.tid); break;
    case 'tdismiss': dismissTimer(a.dataset.tid); break;
    case 'meal': switchMeal(a.dataset.v); break;
    case 'reroll': { const cur = currentDaily() && currentDaily().id; const next = pickFrom(mealRecipes(), cur); if (next) setDaily(next.id, false); renderMain(); const b = $('[data-action="reroll"]'); if (b) b.focus(); break; }
    case 'disc': S.disc[a.dataset.k] = a.dataset.v; $$(`.chip[data-k="${a.dataset.k}"]`).forEach(c => c.setAttribute('aria-pressed', c.dataset.v === a.dataset.v)); break;
    case 'edit-toggle': { const x = recipeEdit(id); x.open = !x.open; refreshRecipeEdit(id); if (x.open) { const field = $('#editWish'); if (field && !field.disabled) field.focus(); } break; }
    case 'edit-parsley': { const x = recipeEdit(id); if (!x.busy && !x.draft) { x.wish = editText(17); refreshRecipeEdit(id); $('#editWish').focus(); } break; }
    case 'edit-generate': adaptRecipe(id); break;
    case 'edit-stop': { const x = recipeEdit(id); if (x.ctl) x.ctl.abort(); break; }
    case 'edit-save': saveRecipeVariant(id); break;
    case 'edit-discard': { const x = recipeEdit(id); if (!x.busy) { x.draft = null; x.error = ''; refreshRecipeEdit(id); $('#editWish').focus(); } break; }
    case 'recipe-import': convertImportedRecipe(); break;
    case 'recipe-cancel': if (recipeImport.ctl) recipeImport.ctl.abort(); break;
    case 'recipe-save': saveImportedRecipe(); break;
    case 'recipe-discard': recipeImport.draft = null; refreshImport(); break;
    case 'create': generate('discover'); break;
    case 'stop': if (S.gen.ctl) S.gen.ctl.abort(); break;
    case 'surprise': surprise(); break;
    case 'libf': S.lib.filter = a.dataset.v; $$('.lib-chips .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === S.lib.filter)); renderLibList(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'editWish') recipeEdit(el.dataset.id).wish = el.value;
  else if (el.id === 'recipeText') recipeImport.text = el.value;
  else if (el.id === 'recipeSource') recipeImport.source = el.value;
  else if (el.id === 'libQ') { S.lib.q = el.value; renderLibList(); }
  else if (el.id === 'useup') S.disc.useup = el.value;
  else if (el.id === 'notes') { const id = el.dataset.id; if (el.value.trim()) S.prefs.notes[id] = el.value.slice(0, 4000); else delete S.prefs.notes[id]; savePrefs(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'recipeAdapt') recipeImport.adapt = e.target.checked;
  else if (e.target.id === 'libSort') { S.lib.sort = e.target.value; renderLibList(); }
  else if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'apiKey') { e.preventDefault(); const b = $('[data-action="api-save"]'); if (b) b.click(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.settingsOpen) { S.settingsOpen = false; renderTop(); $('#setBtn').focus(); }
    else if (S.openId) closeDetail();
  } else if (e.key === 'Tab' && S.openId) {
    const f = $$('#overlay button, #overlay textarea, #overlay input, #overlay select').filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- start ---------- */
document.documentElement.style.setProperty('--tile-mask', `url("data:image/svg+xml,${encodeURIComponent(MASK_SVG)}")`);
applyTheme(); applyLang();
if (!IN_CLAUDE) S.aiAvailable = !!activeKey();
applySeedFavs();
ensureDaily();
renderAll();
getSample().then(s => { if (!s) { S.aiAvailable = false; if (S.view === 'discover') refreshGen(); } });
Store.connect().then(() => { applySeedFavs(); ensureDaily(); renderAll(); }).catch(() => {}).finally(() => setTimeout(maybeAutoDaily, 600));
</script>
</body>
</html>
